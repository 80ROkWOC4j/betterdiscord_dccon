name: Shelter dependency graph

on:
  push:
    branches: [main]
    paths:
      - .gitmodules
      - vendor/shelter
      - .github/scripts/shelter-dependencies.cjs
      - .github/workflows/dependencies.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shelter-dependencies
  cancel-in-progress: false

jobs:
  submit:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required by the Dependency Submission API.
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Generate and submit pinned shelter dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node .github/scripts/shelter-dependencies.cjs > "$RUNNER_TEMP/shelter-dependencies.json"
          gh api --method POST "repos/$GITHUB_REPOSITORY/dependency-graph/snapshots" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --input "$RUNNER_TEMP/shelter-dependencies.json"
